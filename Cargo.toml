[workspace]
resolver = "2"
members = [
    "crates/tpt-protocol-tup",
    "crates/tpt-protocol-core",
    "crates/tpt-protocol-modbus",
    "crates/tpt-protocol-j1939",
    "crates/tpt-protocol-isobus",
    "crates/tpt-protocol-uds",
    "crates/tpt-protocol-canopen",
    "crates/tpt-protocol-doip-someip",
    "crates/tpt-protocol-nmea",
    "crates/tpt-protocol-mavlink",
    "crates/tpt-protocol-bacnet",
    "crates/tpt-protocol-opcua",
    "crates/tpt-protocol-dnp3",
    "crates/tpt-protocol-ethercat",
    "crates/tpt-protocol-sparkplugb",
    "crates/tpt-protocol-ocpp",
    "crates/tpt-protocol-ieee11073-sdc",
    "crates/tpt-protocol-hl7v2",
    "crates/tpt-protocol-knx",
    "crates/tpt-protocol-matter-thread",
    "crates/tpt-protocol-coap",
    "crates/tpt-protocol-daemon",
    "crates/tpt-protocol-cli",
    "crates/tpt-protocol-telos",
    "crates/tpt-protocol-ui-embedded",
    "crates/tpt-protocol-ui-web",
]
exclude = []

[workspace.package]
description = "Open-source, memory-safe protocol suite unifying industrial, medical, and hardware protocols"
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-protocol/tpt-protocol"
repository = "https://github.com/tpt-protocol/tpt-protocol"

[workspace.dependencies]
tpt-protocol-tup = { version = "0.1.0", path = "crates/tpt-protocol-tup", default-features = false }
tpt-protocol-core = { version = "0.1.0", path = "crates/tpt-protocol-core", default-features = false }
mavlink = { version = "0.17", default-features = false, features = ["embedded", "common"] }
minicbor = { version = "2.3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tpt-telos-parser = { version = "0.1.1" }
tpt-telos-ir = { version = "0.2.0" }
tpt-telos-verifier = { version = "0.1.1" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
