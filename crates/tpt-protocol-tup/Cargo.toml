[package]
name = "tpt-protocol-tup"
version = "0.1.0"
description = "TPT Unified Protocol — canonical normalized schema with CBOR binary encoding and JSON mirror"
keywords = ["tpt","tup","cbor","schema","telemetry"]
categories = ["encoding","embedded"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
std = ["alloc", "dep:serde", "dep:serde_json", "dep:hex", "minicbor/std"]
alloc = ["minicbor/alloc"]

[dependencies]
minicbor = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["std"] }
hex = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tpt-protocol-tup = { path = ".", features = ["std"] }
# default-features off: the default `resolve-http` feature pulls in reqwest/h2
# (RUSTSEC-2026-0258). The schema is self-contained, so no remote $ref fetch is needed.
jsonschema = { version = "0.61", default-features = false }
