[package]
name = "tpt-protocol-tup"
version = "0.1.0"
description = "TPT Unified Protocol — canonical normalized schema with CBOR binary encoding and JSON mirror"
keywords = ["tpt","tup","cbor","schema","telemetry"]
categories = ["encoding","embedded"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["dep:serde_json", "minicbor/std"]
alloc = ["minicbor/alloc"]

[dependencies]
minicbor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true, features = ["std"] }
hex = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
