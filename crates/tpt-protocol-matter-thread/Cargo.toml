description = "Matter/Thread implementation, MIT OR Apache-2.0 (rs-matter is Apache-2.0 only)"
keywords = ["tpt","matter","thread","iot","smart-home"]
categories = ["network-programming","embedded"]
authors.workspace = true
edition.workspace = true
