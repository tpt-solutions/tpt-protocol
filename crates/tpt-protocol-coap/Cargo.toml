[package]
name = "tpt-protocol-coap"
version = "0.1.0"
description = "CoAP (RFC 7252) implementation, no_std (coap-rs requires std + tokio)"
keywords = ["tpt", "protocol", "industrial", "embedded"]
categories = ["encoding", "network-programming", "embedded"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = "1"

