[package]
name = "tpt-protocol-j1939"
version = "0.1.0"
description = "SAE J1939 heavy-duty vehicle protocol parser"
keywords = ["tpt","j1939","can-bus","heavy-vehicles","automotive"]
categories = ["network-programming","encoding","parser-implementations"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = "1"

