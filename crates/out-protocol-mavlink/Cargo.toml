[package]
name = "out-protocol-mavlink"
version = "0.1.0"
description = "Private from-scratch MAVLink implementation (not published; alternative to mavlink crate)"
publish = false
keywords = ["tpt", "protocol", "industrial", "embedded"]
categories = ["encoding", "network-programming", "embedded"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = "1"

