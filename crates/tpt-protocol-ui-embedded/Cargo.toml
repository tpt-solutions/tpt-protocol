[package]
publish = false
name = "tpt-protocol-ui-embedded"
version = "0.1.0"
description = "Native embedded UI (Slint) for the TPT Protocol daemon"
keywords = ["tpt", "protocol", "ui", "embedded", "slint"]
categories = ["gui"]
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-solutions/tpt-protocol"
repository = "https://github.com/tpt-solutions/tpt-protocol"

[[bin]]
name = "tpt-protocol-ui-embedded"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
tpt-protocol-tup = { version = "0.1.0", path = "../tpt-protocol-tup", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
slint = "1"

# Standalone workspace root: this crate is excluded from the main workspace.
[workspace]
