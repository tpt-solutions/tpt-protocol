[package]
name = "tpt-protocol-ocpp"
version = "0.1.0"
description = "OCPP 2.0.1 implementation, no_std (the ocpp crate is unmaintained since 2019)"
keywords = ["tpt","ocpp","ev-charging","ocpp2","iot"]
categories = ["network-programming","encoding"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = { workspace = true }

