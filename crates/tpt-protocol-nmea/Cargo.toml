[package]
name = "tpt-protocol-nmea"
version = "0.1.0"
description = "NMEA 0183 implementation, MIT OR Apache-2.0 (the nmea crate is Apache-2.0 only)"
keywords = ["tpt","nmea","gps","marine","nmea2000"]
categories = ["encoding","parser-implementations"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
