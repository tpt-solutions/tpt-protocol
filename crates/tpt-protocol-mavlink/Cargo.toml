[package]
name = "tpt-protocol-mavlink"
version = "0.1.0"
description = "MAVLink protocol crate that wraps the mavlink crate for frame decoding"
keywords = ["tpt","mavlink","drone","uav","telemetry"]
categories = ["aerospace","network-programming"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }
mavlink = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
