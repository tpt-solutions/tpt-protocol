[package]
name = "tpt-protocol-canopen"
version = "0.1.0"
description = "CANopen implementation, no_std (canopen crate requires std + Linux socketcan)"
keywords = ["tpt","canopen","can-bus","fieldbus","embedded"]
categories = ["embedded","network-programming","hardware-support"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = "1"

