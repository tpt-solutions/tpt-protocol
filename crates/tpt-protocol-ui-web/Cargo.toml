[package]
publish = false
name = "tpt-protocol-ui-web"
version = "0.1.0"
description = "Tauri v2 + SvelteKit fleet dashboard for the TPT Protocol daemon"
keywords = ["tpt", "protocol", "ui", "tauri", "dashboard"]
categories = ["gui"]
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-solutions/tpt-protocol"
repository = "https://github.com/tpt-solutions/tpt-protocol"

[lib]
name = "tpt_protocol_ui_web_lib"
path = "src-tauri/src/lib.rs"

[[bin]]
name = "tpt-protocol-ui-web"
path = "src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tpt-protocol-tup = { version = "0.1.0", path = "../tpt-protocol-tup", default-features = false, features = ["std"] }

# Standalone workspace root: this crate is excluded from the main workspace.
[workspace]
