[package]
name = "tpt-protocol-modbus"
version = "0.1.0"
description = "Modbus RTU/TCP implementation, no_std (tokio-modbus requires std + tokio)"
keywords = ["tpt","modbus","rtu","tcp","industrial"]
categories = ["embedded","network-programming","hardware-support"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-protocol-core = { workspace = true }
tpt-protocol-tup = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
proptest = { workspace = true }

