[package]
publish = false
name = "tpt-protocol-cli"
version = "0.1.0"
description = "TPT Protocol terminal UI — ratatui dashboard for live protocol data"
keywords = ["tpt","tui","ratatui","dashboard","terminal"]
categories = ["command-line-utilities"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "tpt-protocol-cli"
path = "src/main.rs"

[dependencies]
tpt-protocol-tup = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
ratatui = "0.29"
crossterm = "0.29"
anyhow = { workspace = true }
clap = { workspace = true }
