[package]
name = "tpt-protocol-core"
version = "0.1.0"
description = "Core traits for TPT Protocol: FrameParser, StateValidator, DataNormalizer"
keywords = ["tpt","protocol","traits","parser","normalizer"]
categories = ["encoding","parser-implementations","embedded"]
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
std = ["tpt-protocol-tup/std", "futures-util"]

[dependencies]
tpt-protocol-tup = { workspace = true }
futures-util = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
