name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly run so new RustSec advisories surface without a push.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-os:
    # The test suite on the platforms users run the daemon on. Linux is covered
    # by the `test` job, and the SocketCAN and serial tests need hardware, so
    # they stay ignored here.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  telos:
    # Formal verification of the Modbus state machines (QF_LRA, no external solver).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tpt-protocol-telos --features verify

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - run: cargo build --workspace --exclude tpt-protocol-daemon --exclude tpt-protocol-cli --exclude tpt-protocol-telos --exclude tpt-protocol-bindings --exclude xtask --target thumbv6m-none-eabi
      # Feature matrix for the foundation crates. `std` is host-only and is
      # deliberately not built here.
      - run: cargo build -p tpt-protocol-tup -p tpt-protocol-core --no-default-features --target thumbv6m-none-eabi
      - run: cargo build -p tpt-protocol-tup --features alloc --target thumbv6m-none-eabi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude tpt-protocol-ui-embedded --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  audit:
    # RustSec advisories. cargo-deny also checks advisories; this job gives the
    # plain cargo-audit report and runs on the weekly schedule too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  bench:
    # Compiles the criterion benchmarks; it does not run them, because shared CI
    # runners are too noisy to compare timings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run

  mqtt:
    # The MQTT sink against a real broker. The broker is started with `docker run`
    # rather than a service container, because the image needs a command override to
    # allow anonymous clients from the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker run -d --name mqtt -p 127.0.0.1:1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
      - run: cargo test -p tpt-protocol-daemon --features mqtt -- --ignored mqtt
        env:
          TPT_MQTT_TEST_ADDR: 127.0.0.1:1883

  python-wheel:
    # Builds the Python module as a wheel. The wheel is not uploaded anywhere.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tpt-protocol-bindings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install maturin
      - run: maturin build --release --out ../../target/wheels

  differential:
    # Modbus parsing checked against pymodbus, the reference Python library. The
    # script encodes and decodes random PDUs with pymodbus and compares the Rust
    # parser's reading of the same bytes. Pinned, so a change of behaviour in
    # pymodbus shows up as a failure rather than drifting in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymodbus==3.6.9
      - run: python scripts/differential/modbus_pymodbus.py

  msrv:
    # Pinned to the workspace rust-version. The ui-* apps are not workspace
    # members (they need Rust 1.90 and are built standalone).
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the v2.1.1 commit. Bump the SHA and the comment together.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  ui-embedded:
    # Standalone crate (not a workspace member). Built on Windows, where the Slint
    # toolchain is known to work without extra system packages.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/tpt-protocol-ui-embedded
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  ui-web:
    # Standalone SvelteKit app; the Tauri shell is built separately.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/tpt-protocol-ui-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx svelte-kit sync
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run build
