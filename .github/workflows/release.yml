name: release

# Builds the daemon and the TUI for Linux, Windows and macOS when a version tag
# (v0.1.0, v0.2.0-rc1, ...) is pushed, then attaches the archives to a GitHub release.
# Cross-compiling is not used: each platform builds on its own runner.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --locked -p tpt-protocol-daemon -p tpt-protocol-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="tpt-protocol-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          for bin in tpt-protocol-daemon tpt-protocol-cli; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" "dist/${name}/"
          done
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tpt-protocol-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
